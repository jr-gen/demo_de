<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duke Energy - New Construction Assistance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <img src="duke3.svg" alt="Duke Energy">
    <h1>New Construction Assistance</h1>
  </header>

  <main class="card">
    <p class="muted">Enter a premise ID or address, then select the type of assistance needed.</p>

    <label for="premise">Premise ID or Address</label>
    <input id="premise" type="text" autocomplete="off" maxlength="200" placeholder="Premise ID or service address">

    <div class="buttons">
      <button type="button" data-purpose="NAICS Removal">NAICS Removal</button>
      <button type="button" data-purpose="Inspection Obligation">Inspection Obligation</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <dl class="context">
      <dt>Agent</dt><dd id="agentName">—</dd>
      <dt>Voice interaction</dt><dd id="voiceInteractionID">—</dd>
    </dl>
  </main>

  <script src="messenger.js"></script>
  <script src="app.js"></script>
</body>
</html>
