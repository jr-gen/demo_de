<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Construction Assistance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="page-title">
    <section id="requestView" class="panel">
      <header class="panel-header">
        <h1 id="page-title">New Construction Assistance</h1>
      </header>

      <form id="requestForm" novalidate>
        <div class="field">
          <label for="purpose">Purpose</label>
          <select id="purpose" name="requestPurpose" required>
            <option value="" selected disabled>Choose a purpose...</option>
            <option value="NAICS Code">NAICS Code</option>
            <option value="Inspection Removal">Inspection Removal</option>
          </select>
        </div>

        <div class="field">
          <label for="premiseID">Premise Code / Address</label>
          <input
            id="premiseID"
            name="premiseID"
            type="text"
            inputmode="text"
            autocomplete="off"
            spellcheck="false"
            maxlength="250"
            placeholder="Enter premise code or address"
            required>
        </div>

        <button id="submitButton" class="primary-button" type="submit">
          Request Specialist Assistance
        </button>

        <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
      </form>

      <div class="context" aria-label="Current interaction context">
        <span>Agent: <strong id="agentName">—</strong></span>
        <span>Voice interaction: <strong id="voiceInteractionID">—</strong></span>
      </div>
    </section>

    <section id="messengerView" class="messenger-panel" hidden>
      <div id="messengerContainer" class="messenger-container">
        <!--
          Keep your existing Genesys Messenger deployment markup/script here.

          The custom application controls the request form above.
          Messenger is intentionally shown only after the form is submitted.

          Your existing Messenger deployment can be left unchanged; the
          JavaScript calls openMessengerWithContext() after collecting:
            - requestPurpose
            - premiseID
            - voiceInteractionID
            - originatingAgentName
        -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
